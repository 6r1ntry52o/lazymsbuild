[workspace]
resolver = "3"
members = ["crates/lazymsbuild-core", "crates/lazymsbuild"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# std::fs::File::lock (build.lock) is stable since 1.89.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/6r1ntry52o/lazymsbuild"
homepage = "https://github.com/6r1ntry52o/lazymsbuild"
keywords = ["msbuild", "clangd", "compile-commands", "tui", "visual-studio"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[workspace.dependencies]
lazymsbuild-core = { path = "crates/lazymsbuild-core", version = "0.1.0" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
glob = "0.3.4"
ratatui = "0.30.2"
regex = "1.13.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
unicode-width = "0.2.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
