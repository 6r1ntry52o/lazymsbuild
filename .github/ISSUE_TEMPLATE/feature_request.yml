name: Feature request
description: Something lazymsbuild could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task or the problem, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: markdown
    attributes:
      value: Please keep examples synthetic; nothing from a private codebase.
